name: Focused non-browser quality checks

on:
  push:
    branches:
      - main
      - arena/01a0dee3-eevee-lab
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-non-browser:
    name: Focused contracts (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find src tools -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          html = Path('index.html').read_text()
          scripts = re.findall(r'<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>', html, re.I | re.S)
          if len(scripts) != 2:
              raise SystemExit(f'expected 2 inline scripts, found {len(scripts)}')
          for index, script in enumerate(scripts):
              (Path(os.environ['RUNNER_TEMP']) / f'eevee-inline-{index}.js').write_text(script)
          print(f'checked syntax targets for {len(scripts)} inline scripts')
          PY
          for script in "$RUNNER_TEMP"/eevee-inline-*.js; do node --check "$script"; done

      - name: Run focused Node contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            test_camera_controller \
            test_creature_actor \
            test_creature_behavior \
            test_creature_manager \
            test_expansions \
            test_experience_systems \
            test_habitat_state \
            test_interaction_system \
            test_mini_games \
            test_phase6_system \
            test_phase7_living_world \
            test_room_manager_phase5 \
            test_ui_controller; do
            node "tools/${test}.js"
          done

      - name: Validate Python tools and asset manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          python3 tools/validate_phase0.py assets/models/rig-manifest.json assets/models/animation-contract.json

  browser:
    name: Browser gameplay and responsive checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-dev --save-exact --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run gameplay and responsive browser matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8099 --bind 127.0.0.1 >"$RUNNER_TEMP/eevee-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8099/index.html -o /dev/null 2>/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/eevee-http.log"
              exit 1
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8099/index.html -o /dev/null
          node tools/verify_all_gameplay.js http://127.0.0.1:8099
          EEVEE_TEST_BASE_URL=http://127.0.0.1:8099 node tools/capture_runtime_evidence.js

      - name: Publish browser test summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f qa/results.json ]; then
            echo '::error title=Browser results missing::The browser suite exited before writing qa/results.json.'
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('qa/results.json').read_text())
          failed = [item for item in data.get('results', []) if not item.get('ok')]
          summary = [
              '## Browser gameplay and responsive checks',
              '',
              f"**{data.get('passed', 0)} passed; {data.get('failed', len(failed))} failed.**",
              ''
          ]
          def workflow_escape(value):
              text = str(value)
              return text.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')

          for item in failed:
              name = workflow_escape(item.get('id', 'unknown'))
              detail = workflow_escape(item.get('detail', ''))
              print(f'::error title=Browser contract failed ({name})::{detail[:1500]}')
              summary.append(f"- **{item.get('id', 'unknown')}** — {item.get('detail', '')}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(chr(10).join(summary) + chr(10))
          PY

      - name: Upload browser screenshots and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-browser-evidence
          path: |
            qa/*.png
            qa/results.json
            qa/runtime/*.png
          if-no-files-found: warn
          retention-days: 7
