name: Eevee center diagnostic

on:
  push:
    branches:
      - ci/expansions-phase7.5-gate

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Probe desktop center
        run: |
          python3 -m http.server 8099 >/tmp/eevee-http.log 2>&1 &
          node tools/diagnose_center.js
